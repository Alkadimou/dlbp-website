<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLBP | Area PR</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/styles.css?v=23">
    <link rel="stylesheet" href="css/identity.css?v=7">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=IBM+Plex+Sans:wght@300;400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">
</head>
<body class="landing-page">

    <!-- Sfondo: elica di DNA cromata (js/core/background.js) -->
    <div class="site-background" aria-hidden="true" data-dim="0.5"></div>
    <div class="grain-overlay"></div>

    <!-- MAIN NAVIGATION -->
    <nav class="main-nav">
        <div class="nav-left">
            <a href="/">
                <img src="assets/logo.png" alt="DLBP Logo" class="nav-logo">
            </a>
        </div>
        <div class="nav-right">
            <a href="/">HOME</a>
            <a href="eventi.html">EVENTI</a>
            <div class="dropdown-wrapper">
                <button id="staff-btn" class="active">AREA RISERVATA</button>
                <div class="dropdown-content" id="staff-dropdown">
                    <a href="admin.html">ADMIN</a>
                    <a href="scanner.html">SCANNER</a>
                    <a href="pr.html" class="active">AREA PR</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main id="app-main" class="eventi-page page-container pr-container">
        <!-- Login Section -->
        <section id="login-section" class="login-card">
            <h2>ACCESSO PR</h2>
            <div class="form-group mb-1-5">
                <input type="email" id="pr-email" placeholder="EMAIL" required>
            </div>
            <div class="form-group mb-1-5">
                <input type="password" id="pr-password" placeholder="PASSWORD" required>
            </div>
            <button id="login-btn" class="submit-btn">ACCEDI</button>
            <div id="login-message" class="form-message hidden"></div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="fade-in stagger-1 hidden w-100">
            <div class="flex-row-between border-bottom mb-2">
                <h2 id="pr-welcome" class="event-card-title text-lg no-margin">DASHBOARD PR</h2>
                <button id="logout-btn" class="submit-btn btn-danger no-margin text-xs">ESCI</button>
            </div>
            <div class="dashboard-grid">
                <div class="kpi-box">
                    <h4>ISCRITTI TOTALI</h4>
                    <div class="kpi-value" id="stat-total">0</div>
                </div>
                <div class="kpi-box">
                    <h4>APPROVATI</h4>
                    <div class="kpi-value" id="stat-approved">0</div>
                </div>
                <div class="kpi-box highlight">
                    <h4>INGRESSI (ENTRATI)</h4>
                    <div class="kpi-value" id="stat-entered">0</div>
                </div>
            </div>

            <div class="event-card-item text-center visible">
                <h3 class="text-sm tracking-wide opacity-70 font-mono mb-1-5">IL TUO LINK DI INVITO</h3>
                <div class="flex-row-center">
                    <input type="text" id="invite-link" readonly class="text-center flex-1">
                    <button id="copy-btn" class="submit-btn no-margin">COPIA</button>
                </div>
            </div>

            <!-- PR Guests List Section -->
            <div class="event-card-item text-left mt-2 visible">
                <h3 class="text-sm tracking-wide opacity-70 font-mono mb-1-5">ISCRITTI ASSOCIATI</h3>
                <div class="table-responsive">
                    <table class="pr-table">
                        <thead>
                            <tr>
                                <th data-sort="name" class="col-name cursor-pointer">NOME</th>
                                <th data-sort="email" class="col-email cursor-pointer">EMAIL</th>
                                <th data-sort="eventId" class="col-email cursor-pointer">EVENTO</th>
                                <th class="col-ticket text-center">TICKET</th>
                                <th data-sort="checked_in">INGRESSO</th>
                            </tr>
                        </thead>
                        <tbody id="pr-guests-tbody">
                            <tr><td colspan="5" class="text-center">Caricamento iscritti...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="social-bottom">
            <div class="social-icons">
                <a href="https://instagram.com/dlbp.art" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg class="social-icon" viewBox="0 0 448 512" aria-hidden="true"><use href="assets/social-icons.svg#instagram"></use></svg>
                </a>
                <span aria-label="Facebook"><svg class="social-icon" viewBox="0 0 320 512" aria-hidden="true"><use href="assets/social-icons.svg#facebook-f"></use></svg></span>
                <span aria-label="TikTok"><svg class="social-icon" viewBox="0 0 448 512" aria-hidden="true"><use href="assets/social-icons.svg#tiktok"></use></svg></span>
                <span aria-label="Telegram"><svg class="social-icon" viewBox="0 0 496 512" aria-hidden="true"><use href="assets/social-icons.svg#telegram"></use></svg></span>
                <span aria-label="WhatsApp"><svg class="social-icon" viewBox="0 0 448 512" aria-hidden="true"><use href="assets/social-icons.svg#whatsapp"></use></svg></span>
                <span aria-label="YouTube"><svg class="social-icon" viewBox="0 0 576 512" aria-hidden="true"><use href="assets/social-icons.svg#youtube"></use></svg></span>
                <span aria-label="SoundCloud"><svg class="social-icon" viewBox="0 0 640 512" aria-hidden="true"><use href="assets/social-icons.svg#soundcloud"></use></svg></span>
            </div>
        </div>
        <div class="copyright-bottom-left">© 2026 DLBP — All rights reserved</div>
    </footer>

    <script type="module" src="js/core/background.js?v=15"></script>

    <script type="module" src="js/pages/pr.js?v=5"></script>
</body>
</html>
