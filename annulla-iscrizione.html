<body class="landing-page">
    <!-- Sfondo: elica di DNA cromata (js/core/background.js) -->

    <div class="grain-overlay"></div>

    <nav class="main-nav">

                </button>
                <div id="unsub-message" class="form-message hidden"></div>
            </div>
        </section>
