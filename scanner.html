<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLBP | Scanner Accessi</title>
    <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/styles.css?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">
</head>
<body class="landing-page">

    <!-- Animated fluid background -->
    <div class="fluid-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="grain-overlay"></div>

    <!-- MAIN NAVIGATION -->
    <nav class="main-nav">
        <div class="nav-left">
            <a href="/">
                <img src="assets/logo.png" alt="DLBP Logo" class="nav-logo">
            </a>
        </div>
        <div class="nav-right">
            <a href="/">HOME</a>
            <a href="eventi.html">EVENTI</a>
            <div class="dropdown-wrapper">
                <button id="staff-btn" class="active">AREA RISERVATA</button>
                <div class="dropdown-content" id="staff-dropdown">
                    <a href="admin.html">ADMIN</a>
                    <a href="scanner.html" class="active">SCANNER</a>
                    <a href="pr.html">AREA PR</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main id="app-main" class="eventi-page page-container scanner-container">

        <!-- Login Section -->
        <section id="login-section" class="login-card">
            <h2>ACCESSO SCANNER</h2>
            <div class="form-group mb-1-5">
                <input type="password" id="scanner-password" placeholder="PASSWORD" required>
            </div>
            <button id="login-btn" class="submit-btn" aria-label="Accedi allo scanner">ACCEDI</button>
            <div id="login-message" class="form-message hidden"></div>
        </section>

        <!-- Scanner Section -->
        <section id="scanner-section" class="fade-in stagger-1 hidden w-100">
            <div class="event-card-item visible">
                <div class="flex-row-between mb-1-5">
                    <h2 class="event-card-title text-lg no-margin">SCANNER QR</h2>
                    <div class="flex-row-center">
                        <div id="live-counter" class="live-counter-box text-sm font-bold opacity-70 font-mono">INGRESSI: -- / --</div>
                        <button id="logout-btn" class="submit-btn btn-danger no-margin text-sm bg-transparent">ESCI</button>
                    </div>
                </div>
                
                <div id="reader"></div>

                <div id="status-box" class="status-box">
                    <h3 id="status-title">STATUS</h3>
                    <div id="status-details" class="user-details"></div>
                    <button id="next-scan-btn" class="submit-btn mt-1-5 w-100">PROSSIMO BIGLIETTO</button>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="social-bottom">
            <div class="social-icons">
                <a href="https://instagram.com/dlbp.art" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <span aria-label="Facebook"><i class="fab fa-facebook-f"></i></span>
                <span aria-label="TikTok"><i class="fab fa-tiktok"></i></span>
                <span aria-label="Telegram"><i class="fab fa-telegram-plane"></i></span>
                <span aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></span>
                <span aria-label="YouTube"><i class="fab fa-youtube"></i></span>
                <span aria-label="SoundCloud"><i class="fab fa-soundcloud"></i></span>
            </div>
        </div>
        <div class="copyright-bottom-left">© 2026 DLBP — All rights reserved</div>
    </footer>

    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        // Staff Dropdown Toggle Logic
        const staffBtn = document.getElementById('staff-btn');
        const staffDropdown = document.getElementById('staff-dropdown');

        if (staffBtn && staffDropdown) {
            staffBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                staffDropdown.classList.toggle('show');
            });

            document.addEventListener('click', () => {
                staffDropdown.classList.remove('show');
            });
        }
    </script>
    <script type="module" src="js/scanner.js"></script>
</body>
</html>
