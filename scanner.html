<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLBP | Scanner Accessi</title>
    <link rel="icon" href="assets/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/styles.css?v=20">
    <link rel="stylesheet" href="css/identity.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=IBM+Plex+Sans:wght@300;400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">
</head>
<body class="landing-page">

    <!-- Sfondo: elica di DNA cromata (js/core/background.js) -->
    <div class="site-background" aria-hidden="true" data-dim="0.5" data-lite></div>
    <div class="grain-overlay"></div>

    <!-- MAIN NAVIGATION -->
    <nav class="main-nav">
        <div class="nav-left">
            <a href="/">
                <img src="assets/logo.png" alt="DLBP Logo" class="nav-logo">
            </a>
        </div>
        <div class="nav-right">
            <a href="/">HOME</a>
            <a href="eventi.html">EVENTI</a>
            <div class="dropdown-wrapper">
                <button id="staff-btn" class="active">AREA RISERVATA</button>
                <div class="dropdown-content" id="staff-dropdown">
                    <a href="admin.html">ADMIN</a>
                    <a href="scanner.html" class="active">SCANNER</a>
                    <a href="pr.html">AREA PR</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main id="app-main" class="eventi-page page-container scanner-container">

        <!-- Login Section -->
        <section id="login-section" class="login-card">
            <h2>ACCESSO SCANNER</h2>
            <div class="form-group mb-1-5">
                <input type="email" id="scanner-email" placeholder="EMAIL" required>
            </div>
            <div class="form-group mb-1-5">
                <input type="password" id="scanner-password" placeholder="PASSWORD" required>
            </div>
            <button id="login-btn" class="submit-btn" aria-label="Accedi allo scanner">ACCEDI</button>
            <div id="login-message" class="form-message hidden"></div>
        </section>

        <!-- Scanner Section -->
        <section id="scanner-section" class="fade-in stagger-1 hidden w-100">
            <div class="event-card-item visible">
                <div class="flex-row-between mb-1-5">
                    <h2 class="event-card-title text-lg no-margin">SCANNER QR</h2>
                    <div class="flex-row-center">
                        <div id="live-counter" class="live-counter-box text-sm font-bold opacity-70 font-mono">INGRESSI: -- / --</div>
                        <button id="logout-btn" class="submit-btn btn-danger no-margin text-sm bg-transparent">ESCI</button>
                    </div>
                </div>
                
                <div id="reader"></div>

                <div id="status-box" class="status-box hidden">
                    <h3 id="status-title">STATUS</h3>
                    <div id="status-details" class="user-details"></div>
                    <button id="next-scan-btn" class="submit-btn mt-1-5 w-100">PROSSIMO BIGLIETTO</button>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="social-bottom">
            <div class="social-icons">
                <a href="https://instagram.com/dlbp.art" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg class="social-icon" viewBox="0 0 448 512" aria-hidden="true"><use href="assets/social-icons.svg#instagram"></use></svg>
                </a>
                <span aria-label="Facebook"><svg class="social-icon" viewBox="0 0 320 512" aria-hidden="true"><use href="assets/social-icons.svg#facebook-f"></use></svg></span>
                <span aria-label="TikTok"><svg class="social-icon" viewBox="0 0 448 512" aria-hidden="true"><use href="assets/social-icons.svg#tiktok"></use></svg></span>
                <span aria-label="Telegram"><svg class="social-icon" viewBox="0 0 496 512" aria-hidden="true"><use href="assets/social-icons.svg#telegram"></use></svg></span>
                <span aria-label="WhatsApp"><svg class="social-icon" viewBox="0 0 448 512" aria-hidden="true"><use href="assets/social-icons.svg#whatsapp"></use></svg></span>
                <span aria-label="YouTube"><svg class="social-icon" viewBox="0 0 576 512" aria-hidden="true"><use href="assets/social-icons.svg#youtube"></use></svg></span>
                <span aria-label="SoundCloud"><svg class="social-icon" viewBox="0 0 640 512" aria-hidden="true"><use href="assets/social-icons.svg#soundcloud"></use></svg></span>
            </div>
        </div>
        <div class="copyright-bottom-left">© 2026 DLBP — All rights reserved</div>
    </footer>

    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
    <script type="module" src="js/core/background.js?v=14"></script>
    <script type="module" src="js/pages/scanner.js?v=5"></script>
</body>
</html>
